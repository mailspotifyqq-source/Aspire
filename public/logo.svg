<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="50%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>

    <linearGradient id="fullGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <linearGradient id="fullBlueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="fullRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark Container (scaled to fit nicely in 200x200 area at x=20, y=20) -->
  <g transform="translate(20, 20)">
    <circle cx="100" cy="100" r="98" fill="url(#fullBgGrad)" />
    <circle cx="100" cy="100" r="95" fill="none" stroke="url(#fullRimGrad)" stroke-width="2" />
    
    <!-- Globe Lines -->
    <g opacity="0.2" stroke="#38bdf8" stroke-width="1.2" fill="none">
      <circle cx="100" cy="100" r="60" />
      <ellipse cx="100" cy="100" rx="60" ry="22" />
      <ellipse cx="100" cy="100" rx="60" ry="42" />
      <ellipse cx="100" cy="100" rx="22" ry="60" />
      <ellipse cx="100" cy="100" rx="42" ry="60" />
      <line x1="40" y1="100" x2="160" y2="100" />
      <line x1="100" y1="40" x2="100" y2="160" />
    </g>

    <!-- Flight Orbit -->
    <path
      d="M 45 125 C 47 75, 95 48, 155 58"
      fill="none"
      stroke="url(#fullBlueGlow)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-dasharray="4 3"
      opacity="0.75"
    />

    <!-- Delta Spire "A" -->
    <!-- Left Wing -->
    <path
      d="M 100 38 L 54 148 C 64 146, 76 143, 86 139 L 100 104 L 108 132 C 116 129, 124 127, 132 125 Z"
      fill="url(#fullBlueGlow)"
      opacity="0.95"
    />
    <!-- Right Wing -->
    <path
      d="M 100 38 L 100 104 L 114 138 C 124 141, 136 145, 146 148 L 100 38 Z"
      fill="url(#fullGoldGrad)"
    />
    <!-- Jet Tip -->
    <path d="M 100 28 L 106 52 L 100 46 L 94 52 Z" fill="#fbbf24" />
    <!-- Horizon Arc -->
    <path d="M 70 118 Q 100 98 130 118 Q 100 106 70 118 Z" fill="url(#fullGoldGrad)" />

    <!-- Compass Star -->
    <g transform="translate(148, 52)">
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
      <path d="M 0 -12 Q 1 -3 10 0 Q 1 3 0 12 Q -1 3 -10 0 Q -1 -3 0 -12 Z" fill="url(#fullGoldGrad)" />
      <path d="M 0 -7 Q 0.8 -2 6 0 Q 0.8 2 0 7 Q -0.8 2 -6 0 Q -0.8 -2 0 -7 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- Typography: ASPIRE TRAVELS -->
  <g transform="translate(250, 115)">
    <!-- Primary Brand Wordmark -->
    <text
      x="0"
      y="0"
      font-family="'Playfair Display', Georgia, serif"
      font-size="62"
      font-weight="700"
      letter-spacing="1.5"
      fill="#0f172a"
    >
      Aspire <tspan fill="#b8860b">Travels</tspan>
    </text>

    <!-- Subtitle: Visa Consultancy & Consular Filing -->
    <text
      x="4"
      y="42"
      font-family="'Inter', -apple-system, sans-serif"
      font-size="16"
      font-weight="600"
      letter-spacing="6"
      fill="#64748b"
      text-transform="uppercase"
    >
      Visa Consultancy &amp; Consular Filing
    </text>

    <!-- Golden Divider Line -->
    <line x1="4" y1="16" x2="620" y2="16" stroke="#b8860b" stroke-width="1.5" opacity="0.3" />
  </g>
</svg>
