<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="markBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="50%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="markGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <linearGradient id="markGoldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Blue Luminous Gradients -->
    <linearGradient id="markBlueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="markRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="markStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Badge Emblem -->
  <circle cx="256" cy="256" r="248" fill="url(#markBgGrad)" />
  <circle cx="256" cy="256" r="242" fill="none" stroke="url(#markRimGrad)" stroke-width="3.5" />

  <!-- Background Subtle Latitude / Globe Grid -->
  <g opacity="0.2" stroke="#38bdf8" stroke-width="2.5" fill="none">
    <circle cx="256" cy="256" r="150" />
    <ellipse cx="256" cy="256" rx="150" ry="52" />
    <ellipse cx="256" cy="256" rx="150" ry="105" />
    <ellipse cx="256" cy="256" rx="55" ry="150" />
    <ellipse cx="256" cy="256" rx="105" ry="150" />
    <line x1="106" y1="256" x2="406" y2="256" />
    <line x1="256" y1="106" x2="256" y2="406" />
  </g>

  <!-- Global Orbital Arc -->
  <path
    d="M 115 316 C 120 186, 240 116, 395 141"
    fill="none"
    stroke="url(#markBlueGlow)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="8 6"
    opacity="0.75"
  />

  <!-- Main Brand Symbol: "A" Spire + Flight Path -->
  <g filter="url(#markShadow)">
    <!-- Left Wing of "A" -->
    <path
      d="M 256 92 L 140 372 C 165 368, 195 361, 222 351 L 256 261 L 278 331 C 298 324, 318 318, 338 312 Z"
      fill="url(#markBlueGlow)"
      opacity="0.95"
    />

    <!-- Right Wing of "A" (Gold) -->
    <path
      d="M 256 92 L 256 261 L 290 346 C 315 354, 345 364, 372 372 L 256 92 Z"
      fill="url(#markGoldGrad)"
    />

    <!-- Central Soaring Jet / Trajectory Needle -->
    <path
      d="M 256 71 L 272 131 L 256 118 L 240 131 Z"
      fill="url(#markGoldAccent)"
    />

    <!-- Aspiration Horizon Arc -->
    <path
      d="M 180 296 Q 256 246 332 296 Q 256 266 180 296 Z"
      fill="url(#markGoldGrad)"
    />

    <!-- Compass Guidance Star -->
    <g transform="translate(375, 126)" filter="url(#markStarGlow)">
      <circle cx="0" cy="0" r="7" fill="#ffffff" />
      <path
        d="M 0 -28 Q 2 -8 22 0 Q 2 8 0 28 Q -2 8 -22 0 Q -2 -8 0 -28 Z"
        fill="url(#markGoldGrad)"
      />
      <path
        d="M 0 -16 Q 1.5 -5 14 0 Q 1.5 5 0 16 Q -1.5 5 -14 0 Q -1.5 -5 0 -16 Z"
        fill="#ffffff"
      />
    </g>

    <!-- Apex Point -->
    <circle cx="256" cy="92" r="5" fill="#ffffff" filter="url(#markStarGlow)" />
  </g>
</svg>
